[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protonabu"
version = "1.0.1"
description = "Open source infrastructure for authoring Domain-Specific Languages (DSLs), originally facilitating the Nabu Design Language"
readme = "README.md"
authors = [
    { name = "Avner Ben", email = "avnerben6@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["nabu", "design", "facts", "parser", "schema", "dsl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "pyparsing>=3.0.0",
    "more-itertools>=10.0.0",
]

[project.optional-dependencies]
test = [
    "hypothesis>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"protonabu" = ["*.nabu", "addendum.nabu"]
"protonabu.adapter" = ["*.nabu", "addendum.nabu"]
"protonabu.demoApp" = ["*.facts", "*.css", "schema.facts", "addendum.nabu", "example/*.facts"]
"protonabu.testing" = ["*.nabu", "addendum.nabu"]
"protonabu.util" = ["*.nabu", "addendum.nabu"]
